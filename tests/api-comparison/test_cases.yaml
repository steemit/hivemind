    # legacy signature: (account, start, type, limit)
    params: ["steemit", "", "blog", 10]

  - id: condenser-get-followers-start-cursor
    name: "condenser_api.get_followers steemit second page (start='alice' seek cursor)"
    api: "condenser_api.get_followers"
    priority: "P0"
    # 1.10 pagination follow-up: second request carrying the start cursor of
    # the first page. Seek semantics make any valid account name
    # deterministic (results begin at/after `start`).
    params: ["steemit", "alice", "blog", 10]

