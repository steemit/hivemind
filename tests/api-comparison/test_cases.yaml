    api: "condenser_api.get_content_replies"
    priority: "P1"
    params: ["steemit", "firstpost"]

  # ==================== Condenser API - Discussions (nested query array) ========
  - id: condenser-discussions-trending
    name: "condenser_api.get_discussions_by_trending (all tags, limit 5)"
    api: "condenser_api.get_discussions_by_trending"
    priority: "P0"
    params:
      - tag: ""
        limit: 5
        truncate_body: 1024

