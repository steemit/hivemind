    name: "condenser_api.get_state /trending (EXPECTED DIFFERENCE: legacy serves the retired-frontend state monolith; Go answers -32000 not-implemented)"
    api: "condenser_api.get_state"
    priority: "P2"
    expected_diff: true
    # Registered expected difference (04 §二 condenser row): the legacy
    # get_state router only served the retired condenser frontend; the Go
    # server deliberately does not approximate it (explicit not-implemented
    # error, D1 deviation). Counted separately by the comparator, never as
    # a failure.
    params: ["trending"]

  - id: condenser-get-account-votes
    name: "condenser_api.get_account_votes steemit (dummy on both sides; error message compared)"
    api: "condenser_api.get_account_votes"
    priority: "P2"
    # Both sides are dummies that error, so the case compares the JSON-RPC
    # error MESSAGE. Legacy raises ApiError(...) which jsonrpcserver 4.0.1
    # answers as -32000 "Server error" (ExceptionResponse) — the
    # informative "get_account_votes is no longer supported, for details
    # see https://steemit.com/..." text lives in legacy's debug error.DATA,
    # not the message. The Go side used to classify the refusal as a
    # validation PublicError (-32602 "Invalid parameters"); that
    # message-layer mismatch was the REAL red reason (the previous note
    # here blamed the URL suffix, which is a data-layer difference the
    # comparator never compares — annotation corrected in planned PR#421).
    # Fixed Go-side via apierrors.NotSupportedError -> -32000 "Server
    # error". Residual registered divergence: legacy error.data carries
    # "ApiError: <msg>" while Go omits data on -32000 (whitelisted: the
    # comparator judges error.message only).
    params: ["steemit"]

