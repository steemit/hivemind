    params: ["steemit", "", 5]

  - id: condenser-get-transaction
    name: "condenser_api.get_transaction all-zero trx id (env-gated: needs steemd)"
    api: "condenser_api.get_transaction"
    priority: "P2"
    params: ["0000000000000000000000000000000000000000"]

  - id: condenser-get-account-votes
    name: "condenser_api.get_account_votes steemit (dummy on both sides; error text compared)"
    api: "condenser_api.get_account_votes"
    priority: "P2"
    params: ["steemit"]

  # ==================== Bridge API - Post (object params) ====================
  - id: bridge-get-post
    name: "bridge.get_post steemit/firstpost"
    api: "bridge.get_post"
    priority: "P0"
    params:
      author: "steemit"
      permlink: "firstpost"

  - id: bridge-normalize-post
    name: "bridge.normalize_post (steemd post payload for steemit/firstpost)"
    api: "bridge.normalize_post"
    priority: "P1"
    # legacy signature: normalize_post(context, post) -- the payload must be
    # a full steemd-format post object (the previous {author, permlink} form
    # failed legacy kwarg binding). Go currently expects the post object at
    # the top level (known divergence, baseline issue #23) so this case is
    # expected red until the Go side is fixed.
    params:
      post:
        id: 33
        author: "steemit"
        permlink: "firstpost"
        category: "meta"
        parent_author: ""
        parent_permlink: "meta"
        title: "Welcome to Steem!"
        body: "steemit.com is a social media platform where everyone gets paid for creating and curating content."
        json_metadata: '{"tags":["meta","steemit","intro","hello","blog"],"app":"steemit/0.1"}'
        created: "2016-03-24T17:59:24"
        last_update: "2016-03-30T17:59:24"
        depth: 0
        children: 89
        net_rshares: 0
        abs_rshares: 0
        vote_rshares: 0
        net_votes: 2671
        active_votes: []
        author_reputation: 36342543411
        promoted: "0.000 STEEM"
        cashout_time: "1969-12-31T23:59:59"
        last_payout: "2016-04-01T17:59:24"
        max_accepted_payout: "1000000.000 SBD"
        percent_steem_dollars: 10000
        total_payout_value: "942.560 SBD"
        curator_payout_value: "731.617 SBD"
        pending_payout_value: "0.000 SBD"
        url: "/meta/@steemit/firstpost"
        root_comment: 33
        root_author: "steemit"
        root_permlink: "firstpost"
        root_title: "Welcome to Steem!"
        allow_replies: true
        allow_votes: true
        allow_curation_rewards: true
        beneficiaries: []

  - id: bridge-get-discussion
    name: "bridge.get_discussion steemit/firstpost"
    api: "bridge.get_discussion"
