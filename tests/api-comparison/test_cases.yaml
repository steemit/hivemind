# Hivemind API consistency test cases.
#
# Parameter shapes follow the LEGACY Python server's wire protocol (the
# authoritative reference), in forms the Go server also accepts:
#   * condenser_api.* -- positional arrays. Discussion-style queries use the
#     steemd/jussi nested-query form: a one-element array holding the query
#     object (legacy `nested_query_compat`, Go params.go shape 2).
#   * bridge.* / hive_api.* -- single object (kwargs) with keys matching the
#     legacy method signatures exactly.
#   * Go-only methods (hive_api.*, bridge.list_top_communities) use the Go
#     handler's object keys; they are P2 and expected to fail against legacy
#     (method not found) -- cross-service comparison for them is impossible
#     (decision D4); the full matrix restructure lands with #421.
#
# Priorities follow the authoritative matrix in
# agent-share/notes/hivemind/2026-Q4/04-comparison.md section 2.
#
# Comparison tuning (ignore_fields / tolerance / unordered / lenient_list)
# is intentionally left empty for now: both servers read the same database,
# so the W4 smoke run establishes the real noise baseline before any field
# is ignored. See api_comparator.py docstring for the option semantics.

config:
  # Path-aware ignore patterns (see api_comparator.IgnoreMatcher). A bare
  # name matches at any depth; a dotted pattern matches one exact path.
  # Nothing is ignored globally: on a shared database business ids must
  # match, so the former global `id` ignore (which masked every level's id
  # fields) has been dropped.
  ignore_fields: []
  tolerance:
    float_epsilon: 0.001      # numeric epsilon; also used for amount strings
    timestamp_seconds: 2      # tolerance for timestamp-aware comparison

test_cases:
  # ==================== Hive core ====================
  - id: db-head-state
    name: "hive.db_head_state (head block/age; age compared with time tolerance)"
    api: "hive.db_head_state"
    priority: "P0"
    params: []                # no arguments; positional empty array

  # ==================== Condenser API - Follow (positional) ====================
  - id: condenser-get-follow-count
    name: "condenser_api.get_follow_count steemit"
    api: "condenser_api.get_follow_count"
    priority: "P0"
    params: ["steemit"]

  - id: condenser-get-followers
    name: "condenser_api.get_followers steemit (start='', type='blog', limit 10)"
    api: "condenser_api.get_followers"
    priority: "P0"
    # legacy signature: (account, start, type, limit)
    params: ["steemit", "", "blog", 10]

  - id: condenser-get-following
    name: "condenser_api.get_following steemit (start='', type='blog', limit 10)"
    api: "condenser_api.get_following"
    priority: "P0"
    params: ["steemit", "", "blog", 10]

  - id: condenser-get-reblogged-by
    name: "condenser_api.get_reblogged_by steemit/firstpost"
    api: "condenser_api.get_reblogged_by"
    priority: "P0"
    params: ["steemit", "firstpost"]

  # ==================== Condenser API - Content (positional) ====================
  - id: condenser-get-content
