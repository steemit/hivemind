# Hivemind API consistency test cases -- 2026-Q4 authoritative matrix.
#
# Coverage (planned PR#421, 04-comparison.md §一 1.9/1.10): every one of the
# 68 method names the legacy server registers (serve.py build_methods) has at
# least one case here -- condenser_api x26, follow_api/tags_api aliases x21
# (one reachability case per alias), bare `call` x1, bridge x19, hive x1.
# The 9 Go-only methods (hive_api x8 + bridge.list_top_communities) live in
# test_cases_go_only.yaml (decision D4: Go-vs-Go self-check track, not
# cross-service comparable).
#
# Parameter shapes follow the LEGACY Python server's wire protocol (the
# authoritative reference), in forms the Go server also accepts:
#   * condenser_api.* / follow_api.* / tags_api.* / `call` -- positional
#     arrays. Discussion-style queries use the steemd/jussi nested-query
#     form: a one-element array holding the query object (legacy
#     `nested_query_compat`, Go params.go shape 2).
#   * bridge.* -- single object (kwargs) with keys matching the legacy
#     method signatures exactly.
#
# Priorities follow the 2026-Q4 comparison matrix (04-comparison.md §二):
#   P0 = core read paths exercised by every frontend (must reach 100%);
#   P1 = secondary paths (remaining condenser queries, remaining bridge
#        methods, alias reachability cases);
#   P2 = expected-difference / dummy-text / env-gated cases.
#
# expected_diff: true marks a REGISTERED expected difference (04 §一): the
# comparator counts these cases separately and they never count as failures,
# but a passing expected-diff case is surfaced so the registry can be pruned.
#
# Sample parameters (1.10): values are legacy-protocol-legal typical samples
# (steemit/firstpost, community hive-139531). Both compared servers read the
# SAME database, so responses are deterministic; cursor/pagination cases use
# seek semantics (results start at/after the cursor), which stay
# well-defined even when the sample does not exist in the target DB. When a
# W4/W6 run against the test-env database needs non-empty page-N results,
# adjust the samples to accounts/posts that actually exist there.
#
# Comparison tuning (ignore_fields / tolerance / unordered / lenient_list)
# is intentionally left empty for now: both servers read the same database,
# so the W4 smoke run establishes the real noise baseline before any field
# is ignored. See api_comparator.py docstring for the option semantics.

config:
  # Path-aware ignore patterns (see api_comparator.IgnoreMatcher). A bare
  # name matches at any depth; a dotted pattern matches one exact path.
  # Nothing is ignored globally: on a shared database business ids must
  # match, so the former global `id` ignore (which masked every level's id
  # fields) has been dropped.
  ignore_fields: []
  tolerance:
    float_epsilon: 0.001      # numeric epsilon; also used for amount strings
    timestamp_seconds: 2      # tolerance for timestamp-aware comparison

test_cases:
  # ==================== Hive core (1/1) ====================
  - id: db-head-state
    name: "hive.db_head_state (head block/age; age compared with time tolerance)"
    api: "hive.db_head_state"
    priority: "P0"
    params: []                # no arguments; positional empty array

