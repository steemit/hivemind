# Docker Compose config - API consistency test environment.
# Runs the Python (legacy) and Go hivemind API servers side by side against
# one database and executes the comparison suite.
#
# The legacy checkout path is parameterized via the LEGACY_CONTEXT env var
# (2026-Q4 plan 04-comparison.md §一 1.8) so the file carries no
# machine-specific absolute paths:
#
#   LEGACY_CONTEXT=/path/to/hivemind_legacy \
#     docker compose -f tests/api-comparison/docker-compose.test.yml up -d
#
# The Go repo context stays relative to this compose file (repo root via ../..).

version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: hivemind-test-postgres
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
      POSTGRES_DB: hivemind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: hivemind-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python (legacy) hivemind API - build context comes from LEGACY_CONTEXT
  python-api:
    build:
      context: ${LEGACY_CONTEXT:-/home/ety001/workspace/hivemind_legacy}
      dockerfile: Dockerfile
    container_name: hivemind-python-api
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
      REDIS_URL: redis://redis:6379
      STEEM_URL: https://api.steemit.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Go hivemind API
  go-api:
    build:
      context: ${GO_CONTEXT:-../..}
      dockerfile: Dockerfile
    container_name: hivemind-go-api
    ports:
      - "8082:8080"
    environment:
      HIVE_DATABASE_URL: postgresql://hivemind:hivemind@postgres:5432/hivemind
      HIVE_REDIS_URL: redis://redis:6379
      HIVE_STEEM_URL: https://api.steemit.com
      HIVE_HTTP_SERVER_PORT: 8080
      HIVE_HTTP_SERVER_HOST: 0.0.0.0
      HIVE_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Test runner
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hivemind-test-runner
    environment:
      PYTHON_API_URL: http://python-api:8080
      GO_API_URL: http://go-api:8080
      TIMEOUT: 30
    depends_on:
      python-api:
        condition: service_healthy
      go-api:
        condition: service_healthy
    volumes:
      - ./results:/app/results
    command: >
      --config test_cases.yaml
      --python-url http://python-api:8080
      --go-url http://go-api:8080
      --timeout 30
      --output results

volumes:
  postgres_data:

# Usage:
# 1. Start the test environment (LEGACY_CONTEXT defaults to the legacy
#    checkout on this machine):
#    docker compose -f docker-compose.test.yml up -d
# 2. Watch the test runner logs:
#    docker compose -f docker-compose.test.yml logs -f test-runner
# 3. Re-run the tests:
#    docker compose -f docker-compose.test.yml restart test-runner
# 4. Stop and clean up:
#    docker compose -f docker-compose.test.yml down -v
#
# NOTE (registered to #432, not fixed here): the python-api service env names
# (DATABASE_URL/REDIS_URL/STEEM_URL) do not match the legacy container's
# expected HIVE_-prefixed variables; env alignment lands with #432.
