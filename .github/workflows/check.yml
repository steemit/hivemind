# CI gates for the Go rewrite (planned PR#433, KR6; see
# agent-share/notes/hivemind/2026-Q4/06-quality.md section 2).
#
# Three jobs, all required-green on PRs to / pushes of next:
#   check       - gofmt, go vet, golangci-lint, `go test -short ./...`
#   integration - PostgreSQL 15 service + `go test -race -p 1 ./...`
#   coverage    - internal/indexer coverage measurement (warn below 60%,
#                 report artifacts; blocks only after Q4 W9 - see TODO)
#
# The docker image job (master pushes) stays in build.yml and is owned by
# planned PR#432. build.yml is intentionally untouched by this workflow.
#
# NOTE on `-p 1`: integration tests issue `DROP SCHEMA public CASCADE` and the
# internal/db + internal/indexer packages both use the database pointed to by
# HIVE_TEST_DATABASE_URL directly (same schema). Package-parallel execution
# would clobber each other's schema (known Q3 pitfall). Per-package dedicated
# databases (hive_condenser_test, hive_hive_test, ...) are the second safety
# net. Never raise -p for these tests against a shared database.

name: check

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (fmt, vet, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep in sync with go.mod (go 1.23.0).
          go-version: '1.23.x'

      - name: Check gofmt
        run: |
          # `gofmt -l` must list zero files; any output fails the gate.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files (run `gofmt -w <file>`):"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # v7 of the action serves golangci-lint v2; version pinned to the
        # release the .golangci.yml schema was validated against.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Unit tests (short, no DB)
        # Integration tests skip themselves when HIVE_TEST_DATABASE_URL is
        # unset, so this exercises the pure unit surface only.
        run: go test -short ./...

  integration:
    name: integration (pg15, race, serial)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HIVE_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # The service health options above already gate step execution on
      # readiness; the probe is defense-in-depth against slow first starts.
      - name: Probe Postgres
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not accept connections in time"
          exit 1

      # -p 1 is REQUIRED, see workflow header note. No pipe/tee here so a
      # non-zero go test exit fails the step.
      - name: Integration tests (race detector, package-serial)
        run: go test -race -p 1 ./...

  coverage:
    name: coverage (internal/indexer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HIVE_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # Measurement command per 06-quality.md section 1 (same on CI and
      # locally; -coverpkg=./internal/indexer over ./internal/indexer/...).
      - name: Measure internal/indexer coverage
        run: |
          go test -p 1 -coverpkg=./internal/indexer ./internal/indexer/... -coverprofile=cover.out
          go tool cover -func=cover.out | tee coverage.txt

      - name: Extract total coverage
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%$/, "", $3); print $3}')"
          if [ -z "$total" ]; then
            echo "::error::could not extract total coverage from cover.out"
            exit 1
          fi
          echo "INDEXER_COVERAGE=${total}" >> "$GITHUB_ENV"
          echo "internal/indexer total coverage: ${total}%"

      - name: Cobertura conversion
        run: |
          go install github.com/boumenot/gocover-cobertura@v1.5.0
          "$(go env GOPATH)/bin/gocover-cobertura" < cover.out > coverage.cobertura.xml

      # TODO(Q4 W9 follow-up): flip to blocking (exit 1) once
      # internal/indexer reliably reaches 60%; until then warn only, per
      # 06-quality.md section 2 (transition period).
      - name: Threshold check (warn below 60%)
        run: |
          cov="${INDEXER_COVERAGE}"
          if awk -v c="$cov" 'BEGIN { exit !(c < 60) }'; then
            echo "::warning::internal/indexer coverage ${cov}% is BELOW the 60% target (transition period: warn only; will block after Q4 W9)"
          else
            echo "internal/indexer coverage ${cov}% meets the 60% target"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            cover.out
            coverage.txt
            coverage.cobertura.xml
          if-no-files-found: error
