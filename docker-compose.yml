# Full-stack local development compose (planned PR#432, 05-deploy.md
# section 1.6).
#
# Every HIVE_* name below matches pkg/config/config.go exactly (Load() key
# -> env var). The pre-#432 file carried five groups of dead env names that
# config never read (HIVE_STEEM_URL, HIVE_STEEM_MAX_*, HIVE_INDEXER_TRAIL_*
# and the HIVE_TELEMETRY_* cluster), so jaeger never saw a trace and the
# indexer's 9091 listener never came up. Since PR#425 HIVE_TELEMETRY_ENABLED
# is actually read (traces kill-switch); every other HIVE_TELEMETRY_* name
# from that dead cluster stays dead.
#
# Port exposure policy (PR#430 audit item 1): the observability listeners
# (9090/9091) serve /metrics AND /debug/pprof/* and must stay off public
# interfaces. They are published to 127.0.0.1 only - reachable for local
# scraping/profiling, not from outside the host. Only 8080 (JSON-RPC) is
# published on all interfaces.

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: hivemind-postgres
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind_password
      POSTGRES_DB: hivemind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis cache (OPTIONAL by config semantics: the cache layer enables only
  # when HIVE_REDIS_URL is non-empty - pkg/config RedisConfig. It is a
  # performance cache, not a dependency: server/indexer run fine without it.
  # The service stays defined so it can be started on demand
  # (`docker compose up -d redis`); applications opt in by uncommenting
  # HIVE_REDIS_URL below. Neither binary hard-depends on it anymore.)
  redis:
    image: redis:7-alpine
    container_name: hivemind-redis
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Hivemind API Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: hivemind-server
    depends_on:
      postgres:
        condition: service_healthy
      # No redis dependency: redis is optional (see above).
    environment:
      # Database
      HIVE_DATABASE_URL: postgresql://hivemind:hivemind_password@postgres:5432/hivemind?sslmode=disable

      # Steem (config keys: steemd_url / max_batch / max_workers)
      HIVE_STEEMD_URL: https://api.steemit.com
      HIVE_MAX_BATCH: 50
      HIVE_MAX_WORKERS: 4

      # Redis (optional): uncomment to enable the cache layer.
      # HIVE_REDIS_URL: redis://redis:6379

      # Server
      HIVE_HTTP_SERVER_PORT: 8080
      HIVE_HTTP_SERVER_HOST: 0.0.0.0

      # Logging
      HIVE_LOG_LEVEL: INFO
      HIVE_LOG_FORMAT: json
      HIVE_LOG_SCALYR_FORMAT: "false"

      # Telemetry (config keys: telemetry_enabled / traces_endpoint /
      # traces_tls / prometheus_enabled / prometheus_port)
      HIVE_TELEMETRY_ENABLED: "true"
      HIVE_TELEMETRY_SERVICE_NAME: hivemind-go-server
      # OTLP/HTTP to the in-network jaeger collector (service below).
      HIVE_TRACES_ENDPOINT: http://jaeger:4318
      # In-network collector has no TLS; a TLS endpoint sets this to "true".
      HIVE_TRACES_TLS: "false"
      HIVE_PROMETHEUS_ENABLED: "true"
      HIVE_PROMETHEUS_PORT: 9090
    ports:
      - "8080:8080"           # JSON-RPC API (public)
      - "127.0.0.1:9090:9090" # /metrics + /debug/pprof (loopback only)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Hivemind Indexer
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    container_name: hivemind-indexer
    depends_on:
      postgres:
        condition: service_healthy
      # No redis dependency: redis is optional (see above).
    environment:
      # Database
      HIVE_DATABASE_URL: postgresql://hivemind:hivemind_password@postgres:5432/hivemind?sslmode=disable

      # Steem (config keys: steemd_url / max_batch / max_workers)
      HIVE_STEEMD_URL: https://api.steemit.com
      HIVE_MAX_BATCH: 50
      HIVE_MAX_WORKERS: 4

      # Redis (optional): uncomment to enable the cache layer.
      # HIVE_REDIS_URL: redis://redis:6379

      # Indexer (config keys: trail_blocks / sync_interval)
      HIVE_TRAIL_BLOCKS: 2
      HIVE_SYNC_INTERVAL: 3

      # Logging
      HIVE_LOG_LEVEL: INFO
      HIVE_LOG_FORMAT: json
      HIVE_LOG_SCALYR_FORMAT: "false"

      # Telemetry: the indexer serves /metrics + /debug/pprof + /health +
      # /head_age on its own observability port (9091 here, 9090 is the
      # server's). It is exempt from the /health head-lag criterion
      # (is_syncer), so it stays healthy during catch-up.
      HIVE_TELEMETRY_ENABLED: "true"
      HIVE_TELEMETRY_SERVICE_NAME: hivemind-go-indexer
      HIVE_TRACES_ENDPOINT: http://jaeger:4318
      HIVE_TRACES_TLS: "false"
      HIVE_PROMETHEUS_ENABLED: "true"
      HIVE_PROMETHEUS_PORT: 9091
    ports:
      - "127.0.0.1:9091:9091" # /metrics + pprof + /health (loopback only)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null http://localhost:9091/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Jaeger (optional, for tracing): all-in-one collector with OTLP enabled.
  # Services ship traces to http://jaeger:4318 (OTLP/HTTP) over the compose
  # network; no host port needed for ingestion. The UI is loopback-only.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: hivemind-jaeger
    ports:
      - "127.0.0.1:16686:16686" # UI (loopback only)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: hivemind-network
